<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leo's — Premium Property Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@200;300;400;500&family=Cinzel:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #f5f5f0;
      --gold-dim: #a8b8a8;
      --gold-bright: #ffffff;
      --dark: #0d0d0d;
      --dark-glass: rgba(10, 14, 10, 0.88);
      --dark-glass-light: rgba(12, 18, 12, 0.75);
      --gold-border: rgba(30, 100, 50, 0.35);
      --gold-border-hover: rgba(30, 140, 70, 0.60);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Jost', sans-serif;
      color: var(--gold);
    }

    /* ── Background image ── */
    .bg-div {
      position: fixed;
      inset: 0;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* ── Back button ── */
    .back-btn {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 900;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--dark-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--gold-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--gold);
      transition: background .25s, border-color .25s;
    }
    .back-btn:hover {
      background: rgba(20, 80, 40, 0.25);
      border-color: var(--gold-border-hover);
    }

    /* ── Brand ── */
    .brand {
      position: fixed;
      top: 18px; right: 20px;
      z-index: 900;
      font-family: 'Cinzel', serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* ── SVG overlay ── */
    .svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* Plot shapes */
    .plot-shape {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 4;
      cursor: pointer;
      transition: fill 0.35s ease, stroke 0.35s ease, stroke-width 0.25s ease, filter 0.35s ease;
      filter: drop-shadow(0 0 0px transparent);
    }
    .plot-shape:hover,
    .plot-shape.active {
      fill: rgba(20, 120, 60, 0.55);
      stroke: #4ade80;
      stroke-width: 8;
      filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.40));
    }
    .plot-shape.tapped {
      fill: rgba(20, 120, 60, 0.55);
      stroke: #4ade80;
      stroke-width: 8;
      filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.40));
    }

    /* ── Tooltip ── */
    .tooltip {
      position: fixed;
      z-index: 950;
      pointer-events: none;
      padding: 6px 14px;
      border-radius: 6px;
      background: var(--dark-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--gold-border);
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--gold-bright);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Side panel ── */
    .side-panel {
      position: fixed;
      top: 0; right: 0;
      width: 340px;
      max-width: 85vw;
      height: 100%;
      z-index: 800;
      background: var(--dark-glass);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-left: 1px solid var(--gold-border);
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .side-panel.open { transform: translateX(0); }

    /* ── Left-side panel variant ── */
    .side-panel.panel-left {
      right: auto;
      left: 0;
      border-left: none;
      border-right: 1px solid var(--gold-border);
      transform: translateX(-100%);
    }
    .side-panel.panel-left.open { transform: translateX(0); }

    .panel-header {
      position: relative;
      padding: 32px 28px 20px;
      border-bottom: 1px solid rgba(30, 100, 50, 0.18);
    }
    .panel-eyebrow {
      font-family: 'Jost', sans-serif;
      font-size: 10px; font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 6px;
    }
    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 500;
      color: var(--gold-bright);
      letter-spacing: 0.02em;
    }

    .panel-body { padding: 24px 28px; flex: 1; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(30, 100, 50, 0.12);
    }
    .info-row:last-child { border-bottom: none; }

    .info-label {
      font-size: 12px; font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-dim);
      display: flex; align-items: center; gap: 8px;
    }
    .info-label svg {
      width: 16px; height: 16px;
      stroke: var(--gold-dim);
      fill: none; stroke-width: 1.5;
      flex-shrink: 0;
    }

    .info-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; font-weight: 500;
      color: var(--gold-bright);
      letter-spacing: 0.02em;
      text-align: right;
    }

    .panel-divider {
      width: 40px; height: 1px;
      background: linear-gradient(90deg, var(--gold-border), transparent);
      margin: 8px 0 16px;
    }

    .panel-note {
      font-size: 12px; font-weight: 300;
      line-height: 1.7;
      color: rgba(160, 200, 160, 0.50);
      letter-spacing: 0.02em;
      margin-top: 12px;
    }

    /* ── Close button inside panel ── */
    .panel-close {
      position: absolute;
      top: 14px; right: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--gold-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--gold-dim);
      transition: background .2s, border-color .2s;
    }
    .panel-close:hover { background: rgba(200,175,120,.12); border-color: var(--gold-border-hover); }

    /* ── Zoom / pan wrapper for SVG ── */
    .map-wrapper {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      touch-action: none;
    }

    /* Garden shapes */
    .garden-shape {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      cursor: pointer;
      transition: fill 0.3s ease, stroke 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 0px transparent);
    }
    .garden-shape:hover {
      fill: rgba(34, 197, 94, 0.22);
      stroke: rgba(134, 239, 172, 0.8);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 14px rgba(34, 197, 94, 0.4));
    }
    .garden-shape.tapped {
      fill: rgba(34, 197, 94, 0.28);
      stroke: rgba(134, 239, 172, 0.9);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 14px rgba(34, 197, 94, 0.5));
    }

    /* Garden tooltip badge */
    .garden-badge {
      position: fixed;
      z-index: 960;
      pointer-events: none;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(5, 46, 22, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(34, 197, 94, 0.4);
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #86efac;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .garden-badge.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Mobile bottom-sheet panel ── */
    @media (max-width: 640px) {
      .brand { font-size: 11px; letter-spacing: 0.12em; right: 12px; top: 14px; }

      .side-panel {
        top: auto;
        bottom: 0; right: 0; left: 0;
        width: 100%; max-width: 100%;
        height: auto;
        max-height: 65vh;
        border-left: none;
        border-top: 1px solid var(--gold-border);
        border-radius: 18px 18px 0 0;
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .side-panel.open { transform: translateY(0); }
      .side-panel.panel-left {
        right: 0; left: 0;
        border-right: none;
        border-top: 1px solid var(--gold-border);
        transform: translateY(100%);
      }
      .side-panel.panel-left.open { transform: translateY(0); }

      .panel-header { padding: 22px 20px 16px; }
      .panel-body { padding: 16px 20px 28px; }

      /* Drag handle */
      .panel-header::before {
        content: '';
        display: block;
        width: 36px; height: 4px;
        border-radius: 2px;
        background: var(--gold-border-hover);
        margin: 0 auto 14px;
      }

      .panel-close { display: flex; }

      .mobile-hint {
        position: fixed;
        bottom: 20px; left: 50%;
        transform: translateX(-50%);
        z-index: 200;
        font-family: 'Jost', sans-serif;
        font-size: 12px; font-weight: 300;
        letter-spacing: 0.10em;
        color: rgba(160, 200, 160, 0.60);
        background: var(--dark-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--gold-border);
        padding: 6px 16px;
        border-radius: 20px;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .mobile-hint.hidden { opacity: 0; }
    }

    @media (min-width: 641px) {
      .side-panel { width: 340px; max-width: 85vw; }
      .panel-close { display: none; }
      .mobile-hint { display: none; }
    }

    /* ── Landscape mobile: compact floating box ── */
    @media (max-height: 500px) and (orientation: landscape) {
      .side-panel {
        top: 50%;
        bottom: auto;
        right: 16px;
        left: auto;
        width: auto;
        min-width: 260px;
        max-width: 42vw;
        height: auto;
        max-height: calc(100vh - 32px);
        border-radius: 14px;
        border: 1px solid var(--gold-border);
        border-left: 1px solid var(--gold-border);
        border-top: 1px solid var(--gold-border);
        transform: translateY(-50%) translateX(calc(100% + 20px));
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
        opacity: 0;
        overflow: hidden;
      }
      .side-panel.open {
        transform: translateY(-50%) translateX(0);
        opacity: 1;
      }
      .side-panel.panel-left {
        right: auto;
        left: 16px;
        border-right: 1px solid var(--gold-border);
        transform: translateY(-50%) translateX(calc(-100% - 20px));
      }
      .side-panel.panel-left.open {
        transform: translateY(-50%) translateX(0);
        opacity: 1;
      }

      .panel-header {
        padding: 14px 16px 10px;
        position: relative;
      }
      .panel-eyebrow { font-size: 9px; margin-bottom: 2px; }
      .panel-title { font-size: 18px; }
      .panel-close { display: flex; top: 10px; right: 10px; width: 26px; height: 26px; }

      .panel-body {
        padding: 8px 16px 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12px;
        overflow: hidden;
      }

      .info-row {
        padding: 7px 0;
        border-bottom: 1px solid rgba(30, 100, 50, 0.12);
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .info-row:last-child { border-bottom: none; }
      .info-label { font-size: 9px; }
      .info-label svg { width: 12px; height: 12px; }
      .info-value { font-size: 14px; text-align: left; }

      .panel-divider { display: none; }
      .panel-note { display: none; }
      .mobile-hint { display: none; }
    }


    /* ── Plot Size Filter Slider ── */
    .plot-filter {
      position: fixed;
      bottom: 20px;
      right: 16px;
      left: auto;
      transform: none;
      z-index: 500;
      background: rgba(10, 14, 10, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(30, 100, 50, 0.35);
      border-radius: 12px;
      padding: 10px 14px 12px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: all;
    }

    .filter-label {
      font-family: 'Jost', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(160, 200, 160, 0.80);
      text-align: center;
    }

    .range-values {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(160, 200, 160, 0.80);
    }

    .range-values span::before { content: ''; }
    #minValue::before { content: 'Min: '; }
    #maxValue::before { content: 'Max: '; }

    .slider-wrap {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
    }

    .slider-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      border-radius: 2px;
      background: rgba(30, 100, 50, 0.35);
      pointer-events: none;
    }

    .slider-range-fill {
      position: absolute;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(74,222,128,0.5), #4ade80);
      pointer-events: none;
      top: 50%;
      transform: translateY(-50%);
      left: 0; right: 0;
    }

    .slider-wrap input[type=range] {
      position: absolute;
      left: 0;
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
      outline: none;
    }

    .slider-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #4ade80;
      border: 2px solid rgba(10,14,10,0.85);
      cursor: grab;
      pointer-events: all;
      box-shadow: 0 0 8px rgba(74,222,128,0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .slider-wrap input[type=range]:active::-webkit-slider-thumb {
      cursor: grabbing;
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(74,222,128,0.9);
    }

    .slider-wrap input[type=range]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #4ade80;
      border: 2px solid rgba(10,14,10,0.85);
      cursor: grab;
      pointer-events: all;
      box-shadow: 0 0 8px rgba(74,222,128,0.6);
    }

    .slider-wrap input[type=range]::-moz-range-track { background: transparent; }

    /* ── Mobile slider toggle button ── */
    .slider-toggle-btn { display: none; }

    @media (max-width: 900px) {
      .slider-toggle-btn {
        display: flex !important;
        align-items: center;
        justify-content: center;
        position: fixed;
        bottom: 16px; right: 12px;
        z-index: 501;
        width: 36px; height: 36px;
        border-radius: 50%;
        background: rgba(10,14,10,0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(30,100,50,0.35);
        cursor: pointer;
        box-shadow: 0 0 10px rgba(74,222,128,0.25);
      }
      .slider-toggle-btn svg {
        width: 18px; height: 18px;
        stroke: #4ade80; fill: none;
        stroke-width: 2; stroke-linecap: round;
      }
      .plot-filter {
        bottom: 60px; right: 12px;
        width: 160px;
        padding: 8px 10px 10px; gap: 5px;
        opacity: 0; pointer-events: none;
        transform: translateY(8px) scale(0.96);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .plot-filter.slider-open {
        opacity: 1; pointer-events: all;
        transform: translateY(0) scale(1);
      }
      .filter-label { font-size: 8px; }
      .range-values { font-size: 10px; }
      .slider-wrap { height: 30px; }
      .slider-wrap input[type=range]::-webkit-slider-thumb { width: 16px; height: 16px; }
      .slider-wrap input[type=range]::-moz-range-thumb { width: 16px; height: 16px; }
    }

    /* Landscape mobile */
    @media (orientation: landscape) and (max-height: 600px) {
      .slider-toggle-btn {
        display: flex !important;
        position: fixed !important;
        bottom: 10px !important; right: 10px !important;
        z-index: 999 !important;
        width: 32px !important; height: 32px !important;
        border-radius: 50%;
        background: rgba(10,14,10,0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(30,100,50,0.35);
        cursor: pointer;
        box-shadow: 0 0 10px rgba(74,222,128,0.25);
        align-items: center; justify-content: center;
      }
      .slider-toggle-btn svg {
        width: 15px !important; height: 15px !important;
        stroke: #4ade80; fill: none;
        stroke-width: 2; stroke-linecap: round;
      }
      .plot-filter {
        bottom: 50px !important; right: 10px !important;
        left: auto !important; width: 150px !important;
        padding: 7px 10px 9px !important; gap: 4px !important;
        opacity: 0 !important; pointer-events: none !important;
        transform: translateY(8px) scale(0.96) !important;
        transition: opacity 0.2s ease, transform 0.2s ease !important;
      }
      .plot-filter.slider-open {
        opacity: 1 !important; pointer-events: all !important;
        transform: translateY(0) scale(1) !important;
      }
      .filter-label { font-size: 7px; }
      .range-values { font-size: 9px; }
      .slider-wrap { height: 26px; }
      .slider-wrap input[type=range]::-webkit-slider-thumb { width: 14px; height: 14px; }
      .slider-wrap input[type=range]::-moz-range-thumb { width: 14px; height: 14px; }
    }

    /* Landscape tablet */
    @media (orientation: landscape) and (min-height: 601px) and (max-width: 1024px) {
      .slider-toggle-btn {
        display: flex !important;
        position: fixed !important;
        bottom: 10px !important; right: 10px !important;
        z-index: 999 !important;
        width: 32px !important; height: 32px !important;
        border-radius: 50%;
        background: rgba(10,14,10,0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(30,100,50,0.35);
        cursor: pointer;
        box-shadow: 0 0 10px rgba(74,222,128,0.25);
        align-items: center; justify-content: center;
      }
      .slider-toggle-btn svg { width: 15px !important; height: 15px !important; }
      .plot-filter {
        bottom: 50px !important; right: 10px !important;
        opacity: 0 !important; pointer-events: none !important;
        transform: translateY(8px) scale(0.96) !important;
        transition: opacity 0.2s ease, transform 0.2s ease !important;
      }
      .plot-filter.slider-open {
        opacity: 1 !important; pointer-events: all !important;
        transform: translateY(0) scale(1) !important;
      }
    }


    /* ── Plot animation states ── */
    .plot-shape {
      transition: fill 0.3s ease, stroke 0.3s ease, filter 0.3s ease, transform 0.3s ease;
      transform-origin: center;
      transform-box: fill-box;
    }

    .plot-shape.size-match {
      fill: rgba(74, 222, 128, .65) !important;
      stroke: #4ade80 !important;
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 18px rgba(74, 222, 128, 1)) !important;
      animation: plotPopOut 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .plot-shape.size-exit {
      animation: plotFadeOut 0.25s ease forwards;
    }

    @keyframes plotPopOut {
      0%   { transform: scale(1);    opacity: 0.3; }
      60%  { transform: scale(1.08); opacity: 1;   }
      100% { transform: scale(1.04); opacity: 1;   }
    }

    @keyframes plotFadeOut {
      0%   { opacity: 1; }
      100% { opacity: 0.15; fill: transparent; stroke: transparent; filter: none; }
    }

  /* ── 360° Hotspot markers ──────────────────────────────── */
  .hotspot-360 { cursor: pointer; }
  .hotspot-360 .hs-pulse-ring {
    fill: none; stroke: rgba(212,175,55,0.6); stroke-width: 8;
    animation: hsPulse 2s ease-out infinite;
    transform-origin: center; transform-box: fill-box;
  }
  .hotspot-360 .hs-pulse-ring-2 {
    fill: none; stroke: rgba(212,175,55,0.35); stroke-width: 5;
    animation: hsPulse 2s ease-out infinite 0.7s;
    transform-origin: center; transform-box: fill-box;
  }
  .hotspot-360 .hs-circle {
    fill: rgba(10,14,10,0.88); stroke: #d4af37; stroke-width: 6;
    transition: fill 0.2s, stroke 0.2s;
  }
  .hotspot-360:hover .hs-circle { fill: rgba(212,175,55,0.25); stroke: #f5d060; }
  .hotspot-360 .hs-icon-text {
    fill: #d4af37; font-size: 52px; font-family: 'Cinzel', serif;
    font-weight: 600; text-anchor: middle; dominant-baseline: middle;
  }

    /* ── DOM refs ── */
    const tooltip       = document.getElementById('tooltip');
    const sidePanel     = document.getElementById('sidePanel');
    const panelTitle    = document.getElementById('panelTitle');
    const infoPlotSize  = document.getElementById('infoPlotSize');
    const infoParkSide  = document.getElementById('infoParkSide');
    const infoFront     = document.getElementById('infoFront');
    const infoLength    = document.getElementById('infoLength');
    const infoDirection = document.getElementById('infoDirection');
    const panelClose    = document.getElementById('panelClose');
    const mapWrapper    = document.getElementById('mapWrapper');
    const svgMap        = document.getElementById('svgMap');
    const mobileHint    = document.getElementById('mobileHint');
    const backBtn       = document.getElementById('backBtn');
    const gardenBadge   = document.getElementById('gardenBadge');

    /* ── Panel open/close ── */
    function openPanel(plotId, clientX) {
      const d = PLOT_DATA[plotId] || {};
      panelTitle.textContent    = d.name      || plotId;
      infoPlotSize.textContent  = d.plotSize  || '—';
      infoParkSide.textContent  = d.parkSide  || '—';
      infoFront.textContent     = d.front     || '—';
      infoLength.textContent    = d.length    || '—';
      infoDirection.textContent = d.direction || '—';
      /* Slide from left if plot is on right half of screen */
      const onRight = clientX != null ? clientX > window.innerWidth / 2 : false;
      sidePanel.classList.toggle('panel-left', onRight);
      sidePanel.classList.add('open');
    }
    function closePanel() {
      sidePanel.classList.remove('open');
      if (lastTappedPlot) {
        lastTappedPlot.classList.remove('tapped');
        lastTappedPlot = null;
      }
    }

    /* ── Hint dismiss ── */
    function dismissHint() {
      if (mobileHint) mobileHint.classList.add('hidden');
    }

    /* ── Close button ── */
    if (panelClose) panelClose.addEventListener('click', closePanel);

    /* ── Tap on map background closes panel ── */
    mapWrapper.addEventListener('click', e => {
      if (e.target === mapWrapper || e.target === svgMap) closePanel();
    });

    /* ── Back button ── */
    backBtn.addEventListener('click', () => {
        const tourReferrer = sessionStorage.getItem('tourReferrer');
        if (tourReferrer) {
            sessionStorage.removeItem('tourReferrer');
            window.location.href = tourReferrer;
        } else {
            window.history.back();
        }
    });

    /* ── Pinch-zoom & pan state ── */
    let scale = 1, tX = 0, tY = 0;
    let lastDist = 0, lastMidX = 0, lastMidY = 0;
    let isDragging = false, dragStartX = 0, dragStartY = 0, dragStartTX = 0, dragStartTY = 0;
    let activeTouches = [];
    const MIN_SCALE = 1, MAX_SCALE = 8;

    function applyTransform() {
      svgMap.style.transform = `translate(${tX}px,${tY}px) scale(${scale})`;
    }

    function clampTranslate() {
      const wRect = mapWrapper.getBoundingClientRect();
      const maxTX = 0;
      const minTX = wRect.width  - wRect.width  * scale;
      const maxTY = 0;
      const minTY = wRect.height - wRect.height * scale;
      tX = Math.min(maxTX, Math.max(minTX, tX));
      tY = Math.min(maxTY, Math.max(minTY, tY));
    }

    function getTouchDist(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    /* ── Touch events on wrapper ── */
    mapWrapper.addEventListener('touchstart', e => {
      activeTouches = Array.from(e.touches);
      if (activeTouches.length === 2) {
        lastDist = getTouchDist(activeTouches[0], activeTouches[1]);
        lastMidX = (activeTouches[0].clientX + activeTouches[1].clientX) / 2;
        lastMidY = (activeTouches[0].clientY + activeTouches[1].clientY) / 2;
        isDragging = false;
      } else if (activeTouches.length === 1) {
        dragStartX = activeTouches[0].clientX;
        dragStartY = activeTouches[0].clientY;
        dragStartTX = tX;
        dragStartTY = tY;
        isDragging = true;
      }
    }, { passive: true });

    mapWrapper.addEventListener('touchmove', e => {
      activeTouches = Array.from(e.touches);
      if (activeTouches.length === 2) {
        e.preventDefault();
        const newDist = getTouchDist(activeTouches[0], activeTouches[1]);
        const newMidX = (activeTouches[0].clientX + activeTouches[1].clientX) / 2;
        const newMidY = (activeTouches[0].clientY + activeTouches[1].clientY) / 2;
        const wRect = mapWrapper.getBoundingClientRect();

        const ratio = newDist / lastDist;
        const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * ratio));

        const originX = lastMidX - wRect.left;
        const originY = lastMidY - wRect.top;
        tX = newMidX - wRect.left - (originX - tX) * (newScale / scale) - (newMidX - lastMidX);
        tY = newMidY - wRect.top  - (originY - tY) * (newScale / scale) - (newMidY - lastMidY);

        scale = newScale;
        lastDist = newDist;
        lastMidX = newMidX;
        lastMidY = newMidY;
        clampTranslate();
        applyTransform();
        isDragging = false;
      } else if (activeTouches.length === 1 && isDragging) {
        if (scale > 1) {
          e.preventDefault();
          const dx = activeTouches[0].clientX - dragStartX;
          const dy = activeTouches[0].clientY - dragStartY;
          tX = dragStartTX + dx;
          tY = dragStartTY + dy;
          clampTranslate();
          applyTransform();
        }
      }
    }, { passive: false });

    mapWrapper.addEventListener('touchend', () => {
      if (Array.from(event.touches).length < 2) isDragging = false;
    }, { passive: true });

    /* ── Plot interaction ── */
    let lastTappedPlot = null;

    document.querySelectorAll('.plot-shape').forEach(shape => {
      const plotId = shape.dataset.plot;

      /* Desktop: hover tooltip + panel */
      shape.addEventListener('mouseenter', e => {
        const d = PLOT_DATA[plotId];
        tooltip.textContent = d ? d.name : plotId;
        tooltip.classList.add('visible');
        shape.classList.add('active');
        openPanel(plotId, e.clientX);
      });
      shape.addEventListener('mousemove', e => {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top  = (e.clientY - 28) + 'px';
      });
      shape.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
        shape.classList.remove('active');
        closePanel();
      });

      /* Mobile: tap to open panel */
      shape.addEventListener('touchstart', e => {
        shape._tapStartX = e.touches[0].clientX;
        shape._tapStartY = e.touches[0].clientY;
        shape._tapStartTime = Date.now();
      }, { passive: true });

      shape.addEventListener('touchend', e => {
        const dx = Math.abs(e.changedTouches[0].clientX - shape._tapStartX);
        const dy = Math.abs(e.changedTouches[0].clientY - shape._tapStartY);
        const dt = Date.now() - shape._tapStartTime;
        if (dx < 10 && dy < 10 && dt < 500) {
          e.preventDefault();
          e.stopPropagation();
          if (lastTappedPlot && lastTappedPlot !== shape) {
            lastTappedPlot.classList.remove('tapped');
          }
          if (lastTappedPlot === shape) {
            // same plot tapped again — toggle off
            shape.classList.remove('tapped');
            lastTappedPlot = null;
            closePanel();
            tooltip.classList.remove('visible');
            return;
          }
          shape.classList.add('tapped');
          lastTappedPlot = shape;
          openPanel(plotId, e.changedTouches[0].clientX);
          dismissHint();
          const d = PLOT_DATA[plotId];
          tooltip.textContent = d ? d.name : plotId;
          const tx = e.changedTouches[0].clientX;
          const ty = e.changedTouches[0].clientY;
          tooltip.style.left = (tx + 14) + 'px';
          tooltip.style.top  = (ty - 40) + 'px';
          tooltip.classList.add('visible');
          clearTimeout(tooltip._hideTimer);
          tooltip._hideTimer = setTimeout(() => tooltip.classList.remove('visible'), 2000);
        }
      }, { passive: false });
    });

    /* ── Garden shapes ── */

    function moveGardenBadge(e) {
      const off = 16;
      let x = e.clientX + off;
      let y = e.clientY - off;
      const bw = gardenBadge.offsetWidth;
      if (x + bw + 8 > window.innerWidth) x = e.clientX - bw - off;
      if (y < 4) y = e.clientY + off;
      gardenBadge.style.left = x + 'px';
      gardenBadge.style.top  = y + 'px';
    }

    document.querySelectorAll('.garden-shape').forEach(shape => {
      const gardenLabel = shape.dataset.label || 'Garden';

      /* Hover badge only — navigation handled by the wrapping <a href> */
      shape.addEventListener('mouseenter', e => {
        gardenBadge.textContent = gardenLabel;
        gardenBadge.classList.add('visible');
        moveGardenBadge(e);
      });
      shape.addEventListener('mousemove', e => moveGardenBadge(e));
      shape.addEventListener('mouseleave', () => {
        gardenBadge.classList.remove('visible');
      });
    });
  
    // ── Arrival highlight: show the plot we navigated from ──
    (function() {
      try {
        var arrivalPlot = sessionStorage.getItem('yoganadArrivalPlot');
        if (!arrivalPlot) return;
        sessionStorage.removeItem('yoganadArrivalPlot');
        var shape = document.querySelector('.plot-shape[data-plot="' + arrivalPlot + '"]');
        if (!shape) return;
        shape.classList.add('active');
        var svg = document.getElementById('svgMap');
        if (svg && typeof openPanel === 'function') {
          var bb = shape.getBBox();
          var rect = svg.getBoundingClientRect();
          var vbW = svg.viewBox.baseVal.width || 3840;
          var vbH = svg.viewBox.baseVal.height || 2160;
          var scaleX = rect.width / vbW;
          var scaleY = rect.height / vbH;
          var screenX = rect.left + (bb.x + bb.width / 2) * scaleX;
          setTimeout(function() {
            openPanel(arrivalPlot, Math.min(screenX + 14, window.innerWidth - 320));
          }, 150);
        }
      } catch(e) {}
    })();

    // ── Plot Size Filter ──
    const minSlider = document.getElementById('minSlider');
    const maxSlider = document.getElementById('maxSlider');
    const minValue  = document.getElementById('minValue');
    const maxValue  = document.getElementById('maxValue');

    function getPlotSize(plotId) {
      const d = PLOT_DATA[plotId];
      if (!d || !d.plotSize) return 0;
      return parseFloat(d.plotSize.replace(/[^0-9.]/g, '')) || 0;
    }

    function updatePlotFilter() {
      let min = parseFloat(minSlider.value);
      let max = parseFloat(maxSlider.value);
      if (min > max) [min, max] = [max, min];
      minValue.textContent = min;
      maxValue.textContent = max;

      // Update range fill bar
      const sliderMin = parseFloat(minSlider.min);
      const sliderMax = parseFloat(minSlider.max);
      const total = sliderMax - sliderMin;
      const leftPct  = ((Math.min(min, max) - sliderMin) / total) * 100;
      const rightPct = ((sliderMax - Math.max(min, max)) / total) * 100;
      const rangeFill = document.getElementById('rangeFill');
      if (rangeFill) {
        rangeFill.style.left  = leftPct + '%';
        rangeFill.style.right = rightPct + '%';
        rangeFill.style.width = 'auto';
      }

      document.querySelectorAll('.plot-shape').forEach(plot => {
        const size = getPlotSize(plot.dataset.plot);
        plot.classList.remove('size-match');
        plot.classList.remove('size-exit');
        void plot.getBoundingClientRect();
        if (size >= min && size <= max) {
          plot.classList.add('size-match');
        } else {
          plot.classList.add('size-exit');
        }
      });
    }

    const minSliderEl = document.getElementById('minSlider');
    const maxSliderEl = document.getElementById('maxSlider');
    if (minSliderEl) minSliderEl.addEventListener('input', updatePlotFilter);
    if (maxSliderEl) maxSliderEl.addEventListener('input', updatePlotFilter);

    // Init fill bar (no filtering until user moves slider)
    (function initFill() {
      const rangeFill = document.getElementById('rangeFill');
      if (rangeFill) {
        rangeFill.style.left  = '0%';
        rangeFill.style.right = '0%';
        rangeFill.style.width = 'auto';
      }
      if (minSlider) minValue.textContent = minSlider.value;
      if (maxSlider) maxValue.textContent = maxSlider.value;
    })();

    // ── Slider toggle (mobile) ──
    const sliderToggleBtn = document.getElementById('sliderToggleBtn');
    const plotFilterEl = document.querySelector('.plot-filter');
    if (sliderToggleBtn && plotFilterEl) {
      sliderToggleBtn.addEventListener('click', function() {
        plotFilterEl.classList.toggle('slider-open');
      });
      document.addEventListener('touchstart', function(e) {
        if (!plotFilterEl.contains(e.target) && !sliderToggleBtn.contains(e.target)) {
          plotFilterEl.classList.remove('slider-open');
        }
      }, { passive: true });
    }


  // ── 360° Hotspot tooltip ──────────────────────────────────
  (function() {
    var tip = document.getElementById('tooltip');
    document.querySelectorAll('.hotspot-360').forEach(function(g) {
