<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leo's Tour</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.0/build/panolens.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap');

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #fadeOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease;
            z-index: 9999;
        }

        #viewer {
            width: 100%;
            height: 100%;
        }

        /* ── Tour Nav (pill bar) ── */
        .tour-nav {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 6px;

            padding: 6px;

            background: rgba(70, 70, 70, .35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 18px;

            z-index: 10000;
        }

        .tour-pill {
            display: flex;
            align-items: center;
            gap: 6px;

            height: 34px;
            padding: 0 12px;

            background: #2b2b2b;
            color: #fff;

            border: none;
            border-radius: 10px;

            font-family: 'Jost', sans-serif;
            font-size: 12px;
            font-weight: 500;

            cursor: pointer;
            white-space: nowrap;
            transition: .25s;
        }

        .tour-pill svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            display: block;
        }

        .tour-pill:hover {
            background: #353535;
            transform: translateY(-1px);
        }

        .tour-pill.active {
            background: #111;
        }

        /* ── Back Button ── */
        #backBtn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10000;
            border: none;
            border-radius: 12px;
            width: 38px;
            height: 38px;
            padding: 0;
            background: rgba(0, 0, 0, .55);
            color: white;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #backBtn:hover {
            background: white;
            color: black;
        }

        #roomInfoCard {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;

            font-family: 'Jost', sans-serif;
            text-align: right;

            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 18px;

            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        #roomInfoCard.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #roomInfoCard .hud-name {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        #roomInfoCard .hud-dims {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.80);
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        #roomInfoCard .hud-sqft {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.60);
            letter-spacing: 0.04em;
        }

        #roomInfoCard .hud-accent {
            color: #ffffff;
        }
/* ── Desktop: keep nav centered ── */
        @media (min-width: 769px) {
            .tour-nav-wrap {
                position: fixed !important;
                bottom: 12px !important;
                left: 50% !important;
                right: auto !important;
                transform: translateX(-50%) !important;
                width: auto !important;
                z-index: 10000 !important;
            }

            .scroll-arrow {
                display: none !important;
            }

            .tour-nav-wrap .tour-nav {
                position: static !important;
                transform: none !important;
                left: auto !important;
                right: auto !important;
                bottom: auto !important;
            }
        }

        /* ── Scroll Arrow Hint ── */
        .tour-nav-wrap {
            position: fixed;
            bottom: 10px;
            left: 8px;
            right: 8px;
            z-index: 10000;
            display: flex;
            align-items: center;
        }

        .tour-nav-wrap .tour-nav {
            position: static;
            transform: none;
            flex: 1;
            min-width: 0;
        }

        .scroll-arrow {
            display: none;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 34px;
            flex-shrink: 0;
            margin-left: 4px;
            background: rgba(70, 70, 70, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .scroll-arrow svg {
            width: 14px;
            height: 14px;
            color: white;
            opacity: 0.85;
        }

        .scroll-arrow.hidden {
            opacity: 0;
        }

        /* ── Mobile Responsive ── */
        @media (max-width: 768px) {
            .tour-nav {
                bottom: 10px;
                left: 8px;
                right: 8px;
                transform: none;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                flex-wrap: nowrap;
                padding: 6px 8px;
                border-radius: 14px;
                gap: 6px;
                max-width: calc(100vw - 16px);
            }

            .tour-nav::-webkit-scrollbar {
                display: none;
            }

            .tour-pill {
                height: 40px;
                padding: 0 14px;
                font-size: 13px;
                border-radius: 10px;
                flex-shrink: 0;
            }

            .tour-pill svg {
                width: 16px;
                height: 16px;
            }

            .scroll-arrow {
                display: flex;
            }

            #roomInfoCard {
                top: 16px;
                right: 10px;
                left: auto;
                padding: 10px 14px;
                border-radius: 12px;
                max-width: calc(100vw - 100px);
            }

            #roomInfoCard .hud-name {
                font-size: 18px;
                margin-bottom: 4px;
            }

            #roomInfoCard .hud-dims {
                font-size: 13px;
                margin-bottom: 2px;
            }

            #roomInfoCard .hud-sqft {
                font-size: 12px;
            }

            /* Back button — small on mobile */
#backBtn {
                width: 34px !important;
                height: 34px !important;
                font-size: 16px !important;
                top: 12px !important;
                left: 12px !important;
                padding: 0 !important;
                border-radius: 10px !important;
                background: #2c2c2c !important;
                backdrop-filter: none !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                line-height: 1 !important;
            }
        }

        @media (max-width: 400px) {
            .tour-pill {
                height: 38px;
                padding: 0 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <script>

            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

        Object.values(rooms).forEach(p => viewer.add(p));
        Object.values(rooms).forEach(room => { room.fadeDuration = 1200; });

        function lookAtYaw(yaw, pitch = 0) {
            const r = 5000;
            const phi = THREE.MathUtils.degToRad(90 - pitch);
            const theta = THREE.MathUtils.degToRad(yaw);
            viewer.tweenControlCenter(
                new THREE.Vector3(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.cos(phi),
                    r * Math.sin(phi) * Math.sin(theta)
                )
            );
        }

        function addHotspot(from, to, yaw, pitch, text) {
            const spot = new PANOLENS.Infospot(500, ARROW_ICON);
            const r = 5000;
            const phi = THREE.MathUtils.degToRad(90 - pitch);
            const theta = THREE.MathUtils.degToRad(yaw);
            spot.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
            spot.addHoverText(text);
            spot.addEventListener("click", () => {
                const overlay = document.getElementById("fadeOverlay");
                viewer.tweenControlCenter(spot.position);
                setTimeout(() => {
                    let fov = viewer.camera.fov;
                    function zoom() {
                        if (fov > 60) {
                            fov -= 1.2;
                            viewer.camera.fov = fov;
                            viewer.camera.updateProjectionMatrix();
                            requestAnimationFrame(zoom);
                        } else {
                            overlay.style.opacity = 0.25;
                            viewer.setPanorama(rooms[to]);
                            viewer.camera.fov = 100;
                            viewer.camera.updateProjectionMatrix();
                            setTimeout(() => { overlay.style.opacity = 0; }, 300);
                            showInfoCard(to);
                        }
                    }
                    zoom();
                }, 400);
            });
            rooms[from].add(spot);
        }

        const roomData = {

        };

        function showInfoCard(roomKey) {
            const data = roomData[roomKey];
            const card = document.getElementById("roomInfoCard");
            if (!data) { card.classList.remove("visible"); return; }
            const sqft = (data.L * data.W).toFixed(2);
            document.getElementById("cardName").textContent = data.name;
            document.getElementById("cardLength").textContent = data.L;
            document.getElementById("cardWidth").textContent = data.W;
            document.getElementById("cardSqft").textContent = sqft;
            card.classList.remove("visible");
            setTimeout(() => card.classList.add("visible"), 80);
        }

        function goToRoom(roomName, btn) {
            // Update active pill
            document.querySelectorAll('.tour-pill').forEach(p => p.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const overlay = document.getElementById("fadeOverlay");
            overlay.style.opacity = 0.25;
            setTimeout(() => {
                viewer.setPanorama(rooms[roomName]);
                viewer.camera.fov = 100;
                viewer.camera.updateProjectionMatrix();
                overlay.style.opacity = 0;
                showInfoCard(roomName);
            }, 300);
        }

        document.getElementById("backBtn").addEventListener("click", () => {
            const tourReferrer = sessionStorage.getItem('tourReferrer');
            if (tourReferrer) {
                sessionStorage.removeItem('tourReferrer');
                window.location.replace(tourReferrer);
            } else if (document.referrer && !document.referrer.includes(location.pathname)) {
                window.location.replace(document.referrer);
            } else {
                window.location.replace('../');
            }
        });

        // Scroll arrow hint
        const tourNav = document.getElementById('tourNav');
        const scrollArrow = document.getElementById('scrollArrow');
        if (tourNav && scrollArrow) {
            function updateScrollArrow() {
                const atEnd = tourNav.scrollLeft + tourNav.clientWidth >= tourNav.scrollWidth - 4;
                scrollArrow.classList.toggle('hidden', atEnd);
            }
            tourNav.addEventListener('scroll', updateScrollArrow);
            window.addEventListener('resize', updateScrollArrow);
            updateScrollArrow();
        }

    </script>
    <script>// Get room from URL
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get("room") || "1";

        // Load room
        if (rooms[roomId]) {
            viewer.setPanorama(rooms[roomId]);
            showInfoCard(roomId);
        }</script>
